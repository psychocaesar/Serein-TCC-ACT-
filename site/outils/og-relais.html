<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>og</title>
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:300 400;src:url('../assets/fonts/fraunces-latin.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300 400;src:url('../assets/fonts/fraunces-italic-latin.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:300 700;src:url('../assets/fonts/hanken-grotesk-latin.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:315px;overflow:hidden;background:#0d1b15}
.card{position:relative;width:600px;height:315px;overflow:hidden;color:#f0f4f0;font-family:'Hanken Grotesk',sans-serif;
  background:radial-gradient(ellipse 70% 80% at 20% 30%,rgba(147,201,172,.16),transparent 65%),radial-gradient(ellipse 50% 60% at 85% 85%,rgba(216,183,138,.10),transparent 60%),#0d1b15}
.text{position:absolute;left:34px;top:40px;width:330px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand span{font-family:'Fraunces',serif;font-size:17px;font-weight:400}
.brand em{color:#d8b78a}
h1{font-family:'Fraunces',serif;font-weight:300;font-size:35px;line-height:1.05;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
h1 em{color:#d8b78a;font-style:italic}
p{margin-top:16px;font-size:11.5px;line-height:1.55;color:#93a89b;font-weight:300;max-width:300px}
.pills{position:absolute;left:34px;bottom:30px;display:flex;gap:12px;font-size:9.5px;color:#93a89b}
.pills span::before{content:'✓ ';color:#93c9ac}
.phone{position:absolute;right:46px;top:30px;width:150px;background:linear-gradient(170deg,#1c3a2e,#0d1f1a);border-radius:22px;padding:5px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.6)}
.phone img{display:block;width:100%;border-radius:17px}
.phone2{right:170px;top:78px;width:120px;opacity:.95;transform:rotate(-6deg);z-index:0}
.phone1{z-index:1}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="brand"><img src="img/logo-relais.svg" alt=""><span>Serein <em>Relais</em></span></div>
    <h1>Tes exercices de TCC<br><em>entre les séances.</em></h1>
    <p>Journal de pensées, exposition, plan anti-rechute, tâches proposées par ton psy. Conçu par un psychologue.</p>
  </div>
  <div class="pills"><span>Gratuit</span><span>Sans pub</span><span>Sans compte</span><span>Hors ligne</span></div>
  <div class="phone phone1"><img src="img/relais-aujourdhui.jpg" alt=""></div>
</div>
</body>
</html>
