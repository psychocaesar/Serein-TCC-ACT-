<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Serein Relais · kit logo « R en deux gestes »</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f4f1ea;color:#1d2a25;width:1400px;padding:36px 40px 40px}
  h1{font-size:24px;margin-bottom:4px} .sub{font-size:14px;color:#5d6b64;margin-bottom:24px}
  .row{display:flex;gap:20px;margin-bottom:20px;align-items:stretch}
  .card{border-radius:18px;display:flex;align-items:center;justify-content:center;padding:24px}
  .dark{background:#0f241d}.light{background:#fff;border:1px solid #ddd6c8}.cream{background:#f4f1ea;border:1px solid #ddd6c8}
  .lab{font-size:12px;color:#5d6b64;margin-top:6px;text-align:center}
  .col{display:flex;flex-direction:column;align-items:center}
  .sizes{display:flex;align-items:flex-end;gap:18px}
</style>
</head>
<body>
<h1>Serein Relais · le R en deux gestes</h1>
<p class="sub">Le R de « Relais » dans le trait du S de Serein : le montant, la séance ; le bol et la jambe, ce qui part avec toi entre les séances.</p>

<div class="row">
  <div class="card dark" style="width:430px;height:430px"><img src="icone-app-arrondie.svg" width="380" height="380" alt=""></div>
  <div class="card dark" style="width:430px;height:430px;overflow:hidden"><img src="symbole-couleur.svg" width="620" height="620" style="margin:-100px" alt=""></div>
  <div style="display:flex;flex-direction:column;gap:20px;flex:1;min-width:0">
    <div class="card light" style="flex:1"><div class="col"><div class="sizes">
      <img src="symbole-couleur-aplat.svg" width="96"><img src="symbole-noir.svg" width="96"><img src="symbole-petit-noir.svg" width="48"><img src="symbole-petit-noir.svg" width="24"><img src="symbole-petit-noir.svg" width="16"></div><span class="lab">aplats · noir · petite coupe 48 / 24 / 16 px</span></div></div>
    <div class="card dark" style="flex:1"><div class="col"><div class="sizes">
      <img src="symbole-blanc.svg" width="96"><img src="icone-app-arrondie.svg" width="60" style="border-radius:13px"><img src="icone-app-arrondie.svg" width="40"><img src="icone-app-arrondie.svg" width="29"><img src="favicon.svg" width="32"><img src="favicon.svg" width="16"></div><span class="lab">blanc · icône 60 / 40 / 29 px · favicon 32 / 16 px</span></div></div>
  </div>
</div>

<div class="row">
  <div class="card light" style="flex:1.4;height:150px"><img src="assemblage-horizontal-clair.svg" height="96" alt=""></div>
  <div class="card dark" style="flex:1.4;height:150px"><img src="assemblage-horizontal-sombre.svg" height="96" alt=""></div>
  <div class="card cream" style="flex:1;height:150px"><img src="assemblage-empile-clair.svg" height="130" alt=""></div>
  <div class="card dark" style="flex:1;height:150px"><img src="assemblage-empile-sombre.svg" height="130" alt=""></div>
</div>
<div class="row">
  <div class="card light" style="flex:1;height:70px"><img src="assemblage-horizontal-clair.svg" height="30" alt=""></div>
  <div class="card dark" style="flex:1;height:70px"><img src="assemblage-horizontal-sombre.svg" height="30" alt=""></div>
  <div class="card dark" style="width:300px;height:70px;gap:14px"><img src="favicon.svg" width="26" style="border-radius:6px"><span style="color:#f0f4f0;font-family:Georgia,serif;font-size:18px">Serein <i style="color:#d8b78a">Relais</i></span></div>
</div>
</body>
</html>
