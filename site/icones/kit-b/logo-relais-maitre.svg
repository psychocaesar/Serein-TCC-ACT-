<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Serein Relais (novembre 2026) : « le R en deux gestes ». Le R de Relais construit dans le trait du S de Serein :
       le montant vert, la séance ; le bol et la jambe sable, ce qui part avec toi entre les séances.
       Kit complet et règles d'usage : site/icones/kit-b/. Ancienne icône (S en deux temps) : logo-relais-s-deux-temps-ancienne.svg
       Les classes bg / halo / fg servent au découpage de make-sources.mjs (éléments auto-fermants). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#132e26"/><stop offset="100%" stop-color="#0a1a14"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#2f6f5e" stop-opacity="0.35"/><stop offset="100%" stop-color="#2f6f5e" stop-opacity="0"/></radialGradient>
    <linearGradient id="vert" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="382"><stop offset="0%" stop-color="#7ee8be"/><stop offset="55%" stop-color="#4db896"/><stop offset="100%" stop-color="#2a8a68"/></linearGradient>
    <linearGradient id="sable" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="382"><stop offset="0%" stop-color="#f0d9b5"/><stop offset="100%" stop-color="#c9a370"/></linearGradient>
  </defs>
  <rect class="bg" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect class="halo" width="512" height="512" rx="108" fill="url(#halo)"/>
  <path class="fg" transform="translate(-30.7 -30.7) scale(1.12)" d="M 196 150 H 256 A 58 58 0 0 1 256 266 H 196 M 236 266 C 272 266 302 316 326 362" fill="none" stroke="url(#sable)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="fg" transform="translate(-30.7 -30.7) scale(1.12)" d="M 186 150 V 362" fill="none" stroke="url(#vert)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
