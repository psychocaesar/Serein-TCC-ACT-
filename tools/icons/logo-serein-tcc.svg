<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Serein Relais (octobre 2026) : « le S en deux temps ». Le S de Serein (même tracé que l'app sœur)
       coupé dans l'épine : la moitié verte, la séance ; la moitié sable prend le relais.
       Kit complet et règles d'usage : site/icones/kit-c/. Ancienne icône : logo-relais-s-carreau-ancienne.svg
       Les classes bg / halo / fg servent au découpage de make-sources.mjs (éléments auto-fermants). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#132e26"/><stop offset="100%" stop-color="#0a1a14"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#2f6f5e" stop-opacity="0.35"/><stop offset="100%" stop-color="#2f6f5e" stop-opacity="0"/></radialGradient>
    <linearGradient id="vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7ee8be"/><stop offset="55%" stop-color="#4db896"/><stop offset="100%" stop-color="#2a8a68"/></linearGradient>
    <linearGradient id="sable" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d9b5"/><stop offset="100%" stop-color="#c9a370"/></linearGradient>
  </defs>
  <rect class="bg" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect class="halo" width="512" height="512" rx="108" fill="url(#halo)"/>
  <path class="fg" transform="translate(-47.4 -58.2) scale(1.204)" d="M 308 158 C 308.0 158.0 242.0 142.0 210.0 178.0 C 187.6 203.2 194.6 223.5 213.8 237.5" fill="none" stroke="url(#vert)" stroke-width="40" stroke-linecap="round"/>
  <path class="fg" transform="translate(-47.4 -58.2) scale(1.204)" d="M 275.3 265.2 C 296.8 277.6 310.2 295.4 306.0 322.0 C 300.0 358.0 228.0 370.0 196.0 362.0" fill="none" stroke="url(#sable)" stroke-width="40" stroke-linecap="round"/>
</svg>
